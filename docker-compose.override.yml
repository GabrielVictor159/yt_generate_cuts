services:
  yt.generate.cuts.worker.videoextraction:
    environment:
      - DOTNET_ENVIRONMENT=Development
      - MaxResolution=720 
    env_file:
      - common.env
    ports:
      - "8383:8080" 
    networks: 
      - yt_generate_cuts
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ./downloads:/app/downloads
    depends_on:
      - db

  yt.generate.cuts.worker.videoprocessing:
    environment:
      - DOTNET_ENVIRONMENT=Development
    env_file:
      - common.env
      - resources.env
    ports:
      - "8384:8080"
    networks:
      - yt_generate_cuts
    # Ollama roda no host Windows; host.docker.internal aponta o container para ele.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ./downloads:/app/downloads
    depends_on:
      - db

  yt.generate.cuts.worker.videoedition:
    environment:
      - DOTNET_ENVIRONMENT=Development
    env_file:
      - common.env
      - resources.env
    ports:
      - "8387:8080"
    networks:
      - yt_generate_cuts
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      # O mesmo volume dos outros workers: a edicao le o arquivo do corte e a
      # legenda gerada na etapa anterior, e grava o editado no mesmo lugar.
      - ./downloads:/app/downloads
    depends_on:
      - db

  yt.generate.cuts.worker.videopublish:
    environment:
      - DOTNET_ENVIRONMENT=Development
    env_file:
      - common.env
    ports:
      - "8385:8080" 
    networks: 
      - yt_generate_cuts
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ./downloads:/app/downloads
    depends_on:
      - db

  yt.generate.cuts.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    env_file:
      - common.env
      - resources.env
    networks:
      - yt_generate_cuts
    ports:
      - "8386:8080"
    # A API tambem registra o cliente Ollama (AddOllama) e precisa alcancar o host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    depends_on:
      - db

  yt.generate.cuts.app.webassembly:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      # Hoje os componentes renderizam no servidor, entao quem chama a API e o
      # container: precisa do nome do servico, nao de localhost.
      - ApiUrl=http://yt.generate.cuts.api:8080/
    ports:
      - "8387:8080"
    networks:
      - yt_generate_cuts
    depends_on:
      - yt.generate.cuts.api
  
  db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=monitoring
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
    networks: 
      - yt_generate_cuts
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  
volumes:
  postgres_data:

networks:
  yt_generate_cuts:


